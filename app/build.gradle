plugins {
    id 'com.android.application'
}

// Credenciales de firma FUERA del repositorio.
// En local: keystore.properties en la raiz del proyecto (esta en .gitignore).
// En CI: variables de entorno KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def firma = [
        storeFile    : keystoreProperties['storeFile']     ?: System.getenv('KEYSTORE_FILE'),
        storePassword: keystoreProperties['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD'),
        keyAlias     : keystoreProperties['keyAlias']      ?: System.getenv('KEY_ALIAS'),
        keyPassword  : keystoreProperties['keyPassword']   ?: System.getenv('KEY_PASSWORD')
]
def hayFirma = firma.storeFile != null && file(firma.storeFile).exists()
if (!hayFirma) {
    logger.warn("AVISO: sin keystore configurado (keystore.properties o variables de entorno). Se compilara sin firmar.")
}

android {

    signingConfigs {
        debug {
            if (hayFirma) {
                storeFile file(firma.storeFile)
                storePassword firma.storePassword
                keyAlias firma.keyAlias
                keyPassword firma.keyPassword
            }
        }
    }
    namespace 'com.wiplay.wiplayandroid'
    compileSdk 35

    defaultConfig {

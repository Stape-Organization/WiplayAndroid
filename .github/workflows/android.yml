name: Android

# Compila la app en cada push y en cada PR para detectar builds rotos.
# Si estan configurados los secrets de firma, genera ademas el AAB firmado de release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor a compilar en release (evenpadel, wiplaypadel, totpadel, summapadel, indoorpadel7)"
        required: false
        default: evenpadel
      subir_a_play:
        description: "Subir el AAB al canal de pruebas internas de Google Play"
        type: boolean
        required: false
        default: false
      track:
        description: "Canal de Play al que subir (internal, alpha, beta, production)"
        required: false
        default: internal

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cachear Gradle
        uses: gradle/actions/setup-gradle@v3

      # Los keystores no viven en el repositorio: llegan como secrets en base64.
      # Cada app esta firmada con una clave distinta, asi que ademas del keystore generico
      # se admite uno especifico por flavor. build.gradle busca primero el del flavor
      # (<FLAVOR>_KEYSTORE_*) y si no existe cae al generico (KEYSTORE_*).
      - name: Restaurar keystores
        id: keystore
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'evenpadel' }}
          GEN_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GEN_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GEN_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GEN_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EVEN_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64_EVENPADEL }}
          EVEN_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD_EVENPADEL }}
          EVEN_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS_EVENPADEL }}
          EVEN_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD_EVENPADEL }}
        run: |
          hay_flavor=false

          if [ -n "$GEN_B64" ]; then
            echo "$GEN_B64" | base64 --decode > "${{ runner.temp }}/generico.jks"
            {
              echo "KEYSTORE_FILE=${{ runner.temp }}/generico.jks"
              echo "KEYSTORE_PASSWORD=$GEN_PASS"
              echo "KEY_ALIAS=$GEN_ALIAS"
              echo "KEY_PASSWORD=$GEN_KEYPASS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: los flavors sin clave propia iran sin firmar"
          fi

          case "$FLAVOR" in
            evenpadel) B64="$EVEN_B64"; PASS="$EVEN_PASS"; ALIAS="$EVEN_ALIAS"; KPASS="$EVEN_KEYPASS" ;;
            *)         B64=""; PASS=""; ALIAS=""; KPASS="" ;;
          esac

          if [ -n "$B64" ]; then
            PREFIJO="$(echo "$FLAVOR" | tr '[:lower:]' '[:upper:]')"
            echo "$B64" | base64 --decode > "${{ runner.temp }}/${FLAVOR}.jks"
            {
              echo "${PREFIJO}_KEYSTORE_FILE=${{ runner.temp }}/${FLAVOR}.jks"
              echo "${PREFIJO}_KEYSTORE_PASSWORD=$PASS"
              echo "${PREFIJO}_KEY_ALIAS=$ALIAS"
              echo "${PREFIJO}_KEY_PASSWORD=$KPASS"
            } >> "$GITHUB_ENV"
            hay_flavor=true
            echo "Keystore propio cargado para el flavor $FLAVOR"
          else
            echo "::notice::El flavor $FLAVOR no tiene keystore propio: se usara el generico"
          fi

          if [ -n "$GEN_B64" ] || [ "$hay_flavor" = true ]; then
            echo "hay_firma=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_firma=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar debug (todos los flavors)
        run: ./gradlew assembleDebug --stacktrace

      - name: Generar AAB de release
        if: steps.keystore.outputs.hay_firma == 'true'
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'evenpadel' }}"
          CAP="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          ./gradlew "bundle${CAP}Release" --stacktrace

      # Solo se sube cuando se lanza a mano marcando la casilla: un push a main NO publica nada.
      - name: Resolver datos de la subida
        id: play
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.subir_a_play == 'true' }}
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'evenpadel' }}"
          case "$FLAVOR" in
            evenpadel)    PKG="es.stape.evenpadel" ;;
            wiplaypadel)  PKG="es.stape.wiplaypadel" ;;
            totpadel)     PKG="totpadel.cat.totpadel" ;;
            summapadel)   PKG="es.stape.easypadel.summapadel" ;;
            indoorpadel7) PKG="es.stape.indoorpadel7" ;;
            pickleball)   PKG="es.stape.easypadel.pickleball" ;;
            *) echo "::error::Flavor sin applicationId conocido: $FLAVOR"; exit 1 ;;
          esac
          echo "package=$PKG" >> "$GITHUB_OUTPUT"
          echo "aab=app/build/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab" >> "$GITHUB_OUTPUT"

      - name: Subir a Google Play
        if: ${{ steps.play.conclusion == 'success' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.play.outputs.package }}
          releaseFiles: ${{ steps.play.outputs.aab }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builds
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Borrar keystores
        if: always()
        run: rm -f "${{ runner.temp }}"/*.jks
